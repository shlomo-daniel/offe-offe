<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <!-- Decorative bread/pastry shapes -->
  <g opacity="0.12" fill="#fff">
    <!-- Croissant shape left -->
    <ellipse cx="150" cy="200" rx="80" ry="40" transform="rotate(-25 150 200)"/>
    <ellipse cx="130" cy="180" rx="60" ry="30" transform="rotate(-25 130 180)"/>
    <!-- Round bread center -->
    <circle cx="600" cy="320" r="55"/>
    <circle cx="600" cy="320" r="35" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- Cake slice right -->
    <polygon points="950,150 1020,280 880,280"/>
    <line x1="950" y1="150" x2="950" y2="280" stroke="#fff" stroke-width="2"/>
    <!-- Wheat stalks far right -->
    <ellipse cx="1100" cy="120" rx="8" ry="22" transform="rotate(-15 1100 120)"/>
    <ellipse cx="1080" cy="160" rx="8" ry="22" transform="rotate(10 1080 160)"/>
    <ellipse cx="1110" cy="200" rx="8" ry="22" transform="rotate(-5 1110 200)"/>
    <line x1="1095" y1="100" x2="1095" y2="280" stroke="#fff" stroke-width="2.5"/>
    <!-- Small circles scattered -->
    <circle cx="300" cy="100" r="15"/>
    <circle cx="400" cy="330" r="12"/>
    <circle cx="800" cy="90" r="18"/>
    <circle cx="750" cy="350" r="10"/>
  </g>
</svg>
